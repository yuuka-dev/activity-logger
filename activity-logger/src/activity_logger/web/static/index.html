<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Logger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f0f1a; color: #d4d4e0;
      padding: 20px 28px; min-height: 100vh;
    }

    /* ── フィルタバー ── */
    .filter-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-bar h1 { font-size: 1.2rem; font-weight: 600; color: #e8e8f0; margin-right: 8px; }
    .ctrl {
      background: #1a1a30; border: 1px solid #2a2a48; color: #c8c8d8;
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
    }
    select.ctrl { cursor: pointer; }
    input.ctrl { width: 180px; }
    input.ctrl::placeholder { color: #555570; }
    .ctrl:focus { outline: 1px solid #6366f1; border-color: #6366f1; }
    .total-badge {
      margin-left: auto;
      background: #1e1e3a; border: 1px solid #2e2e50;
      padding: 6px 16px; border-radius: 6px; font-size: 0.9rem;
    }
    .total-badge strong { color: #818cf8; }

    /* ── タブ切替 ── */
    .tabs {
      display: flex; gap: 2px; margin-bottom: 16px;
    }
    .tab {
      background: #1a1a30; border: 1px solid #2a2a48; border-bottom: none;
      color: #8888a0; padding: 8px 20px; border-radius: 8px 8px 0 0;
      cursor: pointer; font-size: 0.85rem; transition: background 0.15s;
    }
    .tab:hover { background: #222244; }
    .tab.active { background: #16162c; color: #e8e8f0; border-color: #333358; }

    /* ── パネル共通 ── */
    .panel {
      background: #16162c; border: 1px solid #222240;
      border-radius: 0 10px 10px 10px; padding: 0; display: none;
    }
    .panel.active { display: block; }

    /* ── セッション一覧テーブル ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 14px;
      font-size: 0.75rem; font-weight: 500; color: #606080;
      border-bottom: 1px solid #22224a;
      text-transform: uppercase; letter-spacing: 0.04em;
      position: sticky; top: 0; background: #16162c; z-index: 2;
    }
    td {
      padding: 10px 14px; border-bottom: 1px solid #18183a;
      font-size: 0.85rem; vertical-align: top;
    }
    tr:hover td { background: #1c1c38; }
    .exe-name { font-weight: 600; color: #e0e0f0; }
    .win-title { color: #8888a8; font-size: 0.8rem; margin-top: 2px; }
    .mono { font-variant-numeric: tabular-nums; }
    .scroll-wrap { max-height: 520px; overflow-y: auto; }

    /* ── サマリ ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px; padding: 16px;
    }
    .app-card {
      background: #1a1a34; border: 1px solid #24244a;
      border-radius: 8px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .app-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .app-info { flex: 1; min-width: 0; }
    .app-info .name { font-weight: 600; color: #e0e0f0; font-size: 0.9rem; }
    .app-info .stats { color: #8888a8; font-size: 0.78rem; margin-top: 3px; }
    .app-bar-bg {
      width: 100px; height: 8px; background: #0c0c18;
      border-radius: 4px; overflow: hidden; flex-shrink: 0;
    }
    .app-bar-fill { height: 100%; border-radius: 4px; }

    /* ── 詳細 ── */
    .detail-wrap { padding: 20px 24px; }
    .detail-wrap h3 { font-size: 1rem; margin-bottom: 12px; color: #e8e8f0; }
    .detail-grid {
      display: grid; grid-template-columns: 140px 1fr;
      gap: 6px 16px; font-size: 0.88rem;
    }
    .detail-grid dt { color: #6868888; font-weight: 500; }
    .detail-grid dd { color: #d0d0e0; }
    .pct-bar {
      display: inline-block; height: 14px; border-radius: 3px;
      vertical-align: middle; margin-left: 8px;
    }

    .empty-msg {
      text-align: center; padding: 48px; color: #555570; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- フィルタバー -->
  <div class="filter-bar">
    <h1>Activity Logger</h1>
    <input class="ctrl" type="text" id="search" placeholder="exe名で検索..." oninput="loadData()">
    <select class="ctrl" id="dateRange" onchange="loadData()">
      <option value="today">今日</option>
      <option value="this_week">今週</option>
      <option value="this_month">今月</option>
      <option value="all">全期間</option>
    </select>
    <select class="ctrl" id="minDuration" onchange="loadData()">
      <option value="300">5分以上</option>
      <option value="600" selected>10分以上</option>
      <option value="1800">30分以上</option>
      <option value="3600">1時間以上</option>
    </select>
    <div class="total-badge" id="totalBadge">合計: <strong>--</strong></div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <div class="tab active" data-tab="sessions">セッション一覧</div>
    <div class="tab" data-tab="summary">アプリ別サマリ</div>
    <div class="tab" data-tab="detail">詳細</div>
  </div>

  <!-- セッション一覧 -->
  <div class="panel active" id="panel-sessions">
    <div class="scroll-wrap">
      <table>
        <thead>
          <tr>
            <th>アプリケーション</th>
            <th>開始</th>
            <th>終了</th>
            <th>アクティブ</th>
            <th>アイドル</th>
          </tr>
        </thead>
        <tbody id="sessionBody"></tbody>
      </table>
    </div>
  </div>

  <!-- サマリ -->
  <div class="panel" id="panel-summary">
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <!-- 詳細 -->
  <div class="panel" id="panel-detail">
    <div class="detail-wrap" id="detailContent">
      <p class="empty-msg">セッションをクリックしてください</p>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
let _sessions = [];
let _summary = [];

/* ── 初期化 ── */
loadData();

/* ── タブ切替 ── */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    $("panel-" + tab.dataset.tab).classList.add("active");
  });
});

/* ── ユーティリティ ── */
function hashColor(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 60%, 58%)`;
}
function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const ss = Math.floor(sec % 60);
  if (h > 0) return `${h}h${String(m).padStart(2,"0")}m`;
  return `${m}m${String(ss).padStart(2,"0")}s`;
}
function timeStr(iso) {
  return new Date(iso).toLocaleString("ja-JP", {
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ── データ取得 ── */
async function loadData() {
  const params = new URLSearchParams({
    date_range: $("dateRange").value,
    min_duration: $("minDuration").value,
    search: $("search").value,
  });
  const res = await fetch("/api/sessions?" + params);
  const data = await res.json();
  _sessions = data.sessions;
  _summary = data.summary;
  renderSessions();
  renderSummary();
  const total = _summary.reduce((a, s) => a + s.total_active, 0);
  $("totalBadge").innerHTML = `合計: <strong>${fmt(total)}</strong>`;
}

/* ── セッション一覧 ── */
function renderSessions() {
  const body = $("sessionBody");
  if (_sessions.length === 0) {
    body.innerHTML = '<tr><td colspan="5" class="empty-msg">データなし</td></tr>';
    return;
  }
  body.innerHTML = _sessions.map((s, i) => `
    <tr style="cursor:pointer" onclick="showDetail(${i})">
      <td>
        <div class="exe-name">${esc(s.executable)}</div>
        <div class="win-title">${esc(trunc(s.window_title, 60))}</div>
      </td>
      <td class="mono">${timeStr(s.started_at)}</td>
      <td class="mono">${timeStr(s.ended_at)}</td>
      <td class="mono">${fmt(s.active_seconds)}</td>
      <td class="mono">${fmt(s.idle_seconds)}</td>
    </tr>
  `).join("");
}

function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

/* ── サマリ ── */
function renderSummary() {
  const grid = $("summaryGrid");
  if (_summary.length === 0) {
    grid.innerHTML = '<p class="empty-msg">データなし</p>';
    return;
  }
  const max = Math.max(..._summary.map(s => s.total_active), 1);
  grid.innerHTML = _summary.map(item => {
    const color = hashColor(item.executable);
    const pct = (item.total_active / max * 100).toFixed(1);
    return `
      <div class="app-card">
        <div class="app-dot" style="background:${color}"></div>
        <div class="app-info">
          <div class="name">${esc(item.executable)}</div>
          <div class="stats">
            アクティブ ${fmt(item.total_active)}
            アイドル ${fmt(item.total_idle)}
            ${item.session_count}回
          </div>
        </div>
        <div class="app-bar-bg">
          <div class="app-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }).join("");
}

/* ── 詳細 ── */
function showDetail(idx) {
  const s = _sessions[idx];
  if (!s) return;
  const total = s.active_seconds + s.idle_seconds;
  const activePct = total > 0 ? (s.active_seconds / total * 100) : 0;
  const color = hashColor(s.executable);

  $("detailContent").innerHTML = `
    <h3>${esc(s.executable)}</h3>
    <dl class="detail-grid">
      <dt>ウィンドウ</dt><dd>${esc(s.window_title)}</dd>
      <dt>PID</dt><dd>${s.pid}</dd>
      <dt>開始</dt><dd>${new Date(s.started_at).toLocaleString("ja-JP")}</dd>
      <dt>終了</dt><dd>${new Date(s.ended_at).toLocaleString("ja-JP")}</dd>
      <dt>アクティブ</dt><dd>${fmt(s.active_seconds)}</dd>
      <dt>アイドル</dt><dd>${fmt(s.idle_seconds)}</dd>
      <dt>アクティブ率</dt>
      <dd>
        ${activePct.toFixed(0)}%
        <span class="pct-bar" style="width:${activePct.toFixed(0)}px;background:${color}"></span>
      </dd>
    </dl>`;

  /* 詳細タブに切替 */
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelector('[data-tab="detail"]').classList.add("active");
  $("panel-detail").classList.add("active");
}
</script>
</body>
</html>
