<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Logger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f0f1a;
      color: #d4d4e0;
      padding: 24px 32px;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e8e8f0;
    }
    .date-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-nav button, .date-nav input[type=date] {
      background: #1a1a30;
      border: 1px solid #2a2a48;
      color: #c8c8d8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .date-nav button:hover { background: #26264a; }
    .date-nav input[type=date] { padding: 5px 10px; }
    .header select {
      background: #1a1a30;
      border: 1px solid #2a2a48;
      color: #c8c8d8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .total-badge {
      margin-left: auto;
      background: #1e1e3a;
      border: 1px solid #2e2e50;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .total-badge strong { color: #818cf8; }

    /* ── タイムライン ── */
    .timeline-card {
      background: #16162c;
      border: 1px solid #222240;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .timeline-card h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #8888a0;
      margin-bottom: 14px;
    }
    .hour-markers {
      position: relative;
      height: 22px;
      margin-bottom: 4px;
    }
    .hour-mark {
      position: absolute;
      font-size: 0.7rem;
      color: #555570;
      transform: translateX(-50%);
      user-select: none;
    }
    .timeline-bar {
      position: relative;
      height: 52px;
      background: #0c0c18;
      border-radius: 6px;
      overflow: hidden;
    }
    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      min-width: 2px;
      cursor: pointer;
      opacity: 0.88;
      transition: opacity 0.12s, filter 0.12s;
      overflow: hidden;
      line-height: 52px;
      padding: 0 5px;
    }
    .seg-label {
      font-size: 0.72rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    .segment:hover {
      opacity: 1;
      filter: brightness(1.2);
      z-index: 10;
    }
    .grid-line {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: #1a1a30;
      pointer-events: none;
    }
    .now-line {
      position: absolute;
      top: -4px;
      width: 2px;
      height: calc(100% + 8px);
      background: #ef4444;
      pointer-events: none;
      border-radius: 1px;
      z-index: 20;
    }

    /* ── ツールチップ ── */
    .tooltip {
      position: fixed;
      background: #1e1e38;
      border: 1px solid #3a3a5c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.6;
      pointer-events: none;
      z-index: 1000;
      display: none;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .tooltip .exe-name {
      font-weight: 600;
      color: #e0e0f0;
      font-size: 0.88rem;
    }
    .tooltip .title-text { color: #9090b0; }
    .tooltip .time-text { color: #818cf8; }

    /* ── サマリ ── */
    .summary-card {
      background: #16162c;
      border: 1px solid #222240;
      border-radius: 10px;
      padding: 20px 24px;
    }
    .summary-card h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #8888a0;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      color: #606080;
      border-bottom: 1px solid #22224a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #18183a;
      font-size: 0.88rem;
    }
    tr:hover td { background: #1c1c38; }
    .color-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
    }
    .bar-cell { width: 220px; }
    .bar-bg {
      background: #0c0c18;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 4px; }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #555570;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Activity Logger</h1>
    <div class="date-nav">
      <button onclick="changeDate(-1)" title="前日">&#9664;</button>
      <input type="date" id="datePicker" onchange="loadData()">
      <button onclick="changeDate(1)" title="翌日">&#9654;</button>
      <button onclick="goToday()">今日</button>
    </div>
    <select id="minDuration" onchange="loadData()">
      <option value="300" selected>5分以上</option>
      <option value="600">10分以上</option>
      <option value="1800">30分以上</option>
      <option value="3600">1時間以上</option>
    </select>
    <div class="total-badge" id="totalBadge">合計: <strong>--</strong></div>
  </div>

  <div class="timeline-card">
    <h2>タイムライン</h2>
    <div class="hour-markers" id="hourMarkers"></div>
    <div class="timeline-bar" id="timelineBar"></div>
  </div>

  <div class="summary-card">
    <h2>アプリ使用サマリ</h2>
    <table>
      <thead>
        <tr>
          <th>アプリ</th>
          <th>アクティブ</th>
          <th>アイドル</th>
          <th>回数</th>
          <th class="bar-cell">割合</th>
        </tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <div class="tooltip" id="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const tooltip = $("tooltip");
const picker = $("datePicker");

/* ── 初期化 ── */
picker.value = todayStr();
loadData();

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft")  changeDate(-1);
  if (e.key === "ArrowRight") changeDate(1);
});

/* ── ユーティリティ ── */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function hashColor(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 60%, 58%)`;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}時間${m}分`;
  return `${m}分`;
}

function timeStr(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}

/* ── ナビゲーション ── */
function changeDate(delta) {
  const d = new Date(picker.value + "T00:00:00");
  d.setDate(d.getDate() + delta);
  picker.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  loadData();
}
function goToday() { picker.value = todayStr(); loadData(); }

/* ── データ取得 ── */
async function loadData() {
  const minDur = $("minDuration").value;
  const res = await fetch(`/api/timeline?date=${picker.value}&min_duration=${minDur}`);
  const data = await res.json();
  renderTimeline(data.segments);
  renderSummary(data.summary);

  const total = data.summary.reduce((a, s) => a + s.total_active, 0);
  $("totalBadge").innerHTML = `合計: <strong>${fmt(total)}</strong>`;
}

/* ── タイムライン描画 ── */
function renderTimeline(segments) {
  const bar = $("timelineBar");
  const markers = $("hourMarkers");
  bar.innerHTML = "";
  markers.innerHTML = "";

  const DAY = 24 * 60;

  /* 時間グリッド */
  for (let h = 0; h <= 24; h++) {
    const pct = (h / 24 * 100).toFixed(4);
    if (h > 0 && h < 24) {
      const line = document.createElement("div");
      line.className = "grid-line";
      line.style.left = pct + "%";
      bar.appendChild(line);
    }
    if (h % 2 === 0) {
      const mk = document.createElement("span");
      mk.className = "hour-mark";
      mk.style.left = pct + "%";
      mk.textContent = h + ":00";
      markers.appendChild(mk);
    }
  }

  /* 現在時刻インジケータ（今日のみ） */
  if (picker.value === todayStr()) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const line = document.createElement("div");
    line.className = "now-line";
    line.style.left = (nowMin / DAY * 100).toFixed(4) + "%";
    bar.appendChild(line);
  }

  /* セグメント */
  for (const seg of segments) {
    const s = new Date(seg.start);
    const e = new Date(seg.end);
    const sMin = s.getHours() * 60 + s.getMinutes();
    const eMin = e.getHours() * 60 + e.getMinutes() || DAY;
    const dur = Math.max(eMin - sMin, 1);

    const div = document.createElement("div");
    div.className = "segment";
    div.style.left = (sMin / DAY * 100).toFixed(4) + "%";
    div.style.width = (dur / DAY * 100).toFixed(4) + "%";
    div.style.backgroundColor = hashColor(seg.executable);

    /* セグメント幅が十分ならアプリ名を表示 */
    const label = document.createElement("span");
    label.className = "seg-label";
    label.textContent = seg.executable.replace(/\.exe$/i, "");
    div.appendChild(label);

    div.addEventListener("mouseenter", () => {
      tooltip.style.display = "block";
      tooltip.innerHTML =
        `<div class="exe-name">${esc(seg.executable)}</div>` +
        `<div class="title-text">${esc(seg.window_title)}</div>` +
        `<div class="time-text">${timeStr(seg.start)} ～ ${timeStr(seg.end)}</div>` +
        `アクティブ: ${fmt(seg.active_seconds)}　アイドル: ${fmt(seg.idle_seconds)}`;
    });
    div.addEventListener("mousemove", e => {
      tooltip.style.left = (e.clientX + 12) + "px";
      tooltip.style.top  = (e.clientY + 12) + "px";
    });
    div.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });

    bar.appendChild(div);
  }

  if (segments.length === 0) {
    const msg = document.createElement("div");
    msg.className = "empty-msg";
    msg.textContent = "この日のデータはありません";
    msg.style.position = "absolute";
    msg.style.width = "100%";
    msg.style.top = "50%";
    msg.style.transform = "translateY(-50%)";
    bar.appendChild(msg);
  }
}

/* ── サマリ描画 ── */
function renderSummary(summary) {
  const body = $("summaryBody");
  body.innerHTML = "";

  if (summary.length === 0) {
    body.innerHTML = '<tr><td colspan="5" class="empty-msg">データなし</td></tr>';
    return;
  }

  const maxActive = Math.max(...summary.map(s => s.total_active), 1);

  for (const item of summary) {
    const color = hashColor(item.executable);
    const pct = (item.total_active / maxActive * 100).toFixed(1);
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><span class="color-dot" style="background:${color}"></span>${esc(item.executable)}</td>` +
      `<td>${fmt(item.total_active)}</td>` +
      `<td>${fmt(item.total_idle)}</td>` +
      `<td>${item.session_count}</td>` +
      `<td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></td>`;
    body.appendChild(tr);
  }
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
