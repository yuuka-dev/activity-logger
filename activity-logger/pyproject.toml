[project]
name = "activity-logger"
version = "0.1.0"
description = "閾値フィルタ付き Windows アクティビティロガー"
readme = "README.md"
authors = [
    { name = "Proletariat Yuuka", email = "sounyan.is.the.angel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.9.6",
    "psutil>=7.2.2",
    "pywin32>=311",
    "textual>=8.2.5",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
activity-logger = "activity_logger.cli.main:app"
activity-collector = "activity_logger.collector.main:run"
activity-web = "activity_logger.web.server:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "pydeps>=3.0.6",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "snakeviz>=2.2.2",
]
